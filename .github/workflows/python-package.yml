# CI：脚本质量把关（文件名保持 python-package.yml——README 徽章 URL 依赖它）
# 覆盖：5 个 Python 版本的行为测试 + Word 合并路径（需 python-docx，独立 job 隔离可选依赖）

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: pytest (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
    - name: Lint (fatal errors only)
      run: |
        # 仅阻断语法错误与未定义名（E9/F63/F7/F82）；风格问题不阻断
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test
      # test_merge_word.py 无 python-docx 时自动跳过，由下方 merge-word job 覆盖
      run: python -m pytest tests/ -v

  merge-word:
    name: Word merge (python-docx)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest python-docx
    - name: Test Word merge path
      run: python -m pytest tests/test_merge_word.py -v
